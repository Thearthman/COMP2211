[project]
name = "comp2211_labs"
version = "0.1.0"
description = "Project for running comp2211 lab codes locally"
requires-python = ">=3.12,<3.14"
dependencies = [
 "matplotlib>=3.11.2",
 "numpy>=2.5.3",
 "opencv-python>=5.0.0.93",
 "pandas>=3.0.6",
 "scikit-learn>=1.9.1",
 "seaborn>=0.13.2",
 "tensorflow>=2.21.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "scikit-learn-stubs>=0.0.3",
]



